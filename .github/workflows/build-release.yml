name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.1.7)'
        required: true
        default: 'v1.1.7'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g'
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          BUILD_NAME=$(echo $VERSION | sed 's/^v//')
          BUILD_NUMBER=$(echo $BUILD_NAME | awk -F. '{printf("%d%02d%02d", $1, $2, $3)}')
          echo "Building with build-name: $BUILD_NAME, build-number: $BUILD_NUMBER"
          flutter build apk --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
          flutter build appbundle --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Package Android artifacts
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          mkdir -p dist/android

          APK_PATH=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*release*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            find build/app/outputs/flutter-apk -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$APK_PATH" "dist/android/tally-${VERSION}-android.apk"

          AAB_PATH=$(find build/app/outputs/bundle/release -maxdepth 1 -name '*release*.aab' | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB not found"
            find build/app/outputs/bundle/release -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$AAB_PATH" "dist/android/tally-${VERSION}-android.aab"

          ls -lh dist/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: dist/android/tally-*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $VERSION = "${{ github.event.inputs.tag_name }}"
          } else {
            $VERSION = "${{ github.ref_name }}"
          }
          "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Prepare code-signing certificate
        id: cert
        shell: pwsh
        run: |
          $outDir = "build/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $publisher = "CN=Luminous, O=Luminous, C=CN"
          # Prefer repo secrets; otherwise generate a self-signed cert for MSIX.
          $b64 = "${{ secrets.WINDOWS_PFX_BASE64 }}"
          $pwd = "${{ secrets.WINDOWS_PFX_PASSWORD }}"
          $secretPublisher = "${{ secrets.WINDOWS_PFX_PUBLISHER }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "tally-windows.pfx"
          $cerPath = Join-Path $outDir "tally-windows-selfsigned.cer"

          if (-not [string]::IsNullOrWhiteSpace($secretPublisher)) {
            $publisher = $secretPublisher
          }

          if (-not [string]::IsNullOrWhiteSpace($b64) -and -not [string]::IsNullOrWhiteSpace($pwd)) {
            Write-Host "Using certificate from repository secrets."
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($b64))
            $certPwd = ConvertTo-SecureString -String $pwd -Force -AsPlainText
            try {
              $tmpCer = Join-Path $env:RUNNER_TEMP "tally-from-pfx.cer"
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $certPwd)
              [IO.File]::WriteAllBytes($tmpCer, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Copy-Item $tmpCer $cerPath -Force
            } catch {
              Write-Host "WARN: could not export cer from secrets PFX: $_"
            }
            "cert_source=secrets" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Generating self-signed code-signing certificate for MSIX..."
            $certPwdPlain = "TallyMsixSelfSigned-1.1.7"
            $certPwd = ConvertTo-SecureString -String $certPwdPlain -Force -AsPlainText
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject $publisher `
              -FriendlyName "Tally MSIX Self-Signed" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature `
              -NotAfter (Get-Date).AddYears(5) `
              -CertStoreLocation "Cert:\CurrentUser\My"
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $certPwd | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            $pwd = $certPwdPlain
            "cert_source=selfsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          # publisher must match certificate Subject
          $certObj = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, (ConvertTo-SecureString -String $pwd -Force -AsPlainText))
          $subject = $certObj.Subject
          Write-Host "Certificate subject: $subject"
          $pubspec = Get-Content pubspec.yaml -Raw
          $pubspec = $pubspec -replace '(?m)^\s*publisher:.*$', ('  publisher: "' + $subject + '"')
          Set-Content pubspec.yaml -Value $pubspec -Encoding utf8NoBOM -NoNewline

          "has_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pfx_password=$pwd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cer_path=$cerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publisher=$subject" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSIX
        if: steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.set_version.outputs.version }}"
          $outName = "tally-$tag-windows"
          dart run msix:create `
            --build-windows false `
            --output-path build/windows `
            --output-name $outName `
            --certificate-path "${{ steps.cert.outputs.pfx_path }}" `
            --certificate-password "${{ steps.cert.outputs.pfx_password }}" `
            --publisher "${{ steps.cert.outputs.publisher }}" `
            --install-certificate false `
            --release
          Get-ChildItem -Path build/windows -Filter "*.msix" | Format-List FullName, Length
          Get-ChildItem -Path build/windows -Filter "*.cer" | Format-List FullName, Length

      - name: Create Windows Zip
        shell: pwsh
        run: |
          $version = "${{ steps.set_version.outputs.version }}"
          $zipName = "tally-${version}-windows.zip"
          Write-Host "Creating zip: $zipName"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\$zipName
          Get-ChildItem -Path build\windows -Filter "tally-*.zip" | Format-List Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            build/windows/tally-*.zip
            build/windows/*.msix
            build/windows/*.cer
            build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          BUILD_NAME=$(echo $VERSION | sed 's/^v//')
          BUILD_NUMBER=$(echo $BUILD_NAME | awk -F. '{printf("%d%02d%02d", $1, $2, $3)}')
          echo "Building macOS with build-name: $BUILD_NAME, build-number: $BUILD_NUMBER"
          flutter build macos --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Package macOS DMG
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find build/macos/Build/Products/Release -maxdepth 2 -print
            exit 1
          fi
          mkdir -p dist/macos
          DMG_PATH="dist/macos/tally-${VERSION}-macos.dmg"
          STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Tally" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          rm -rf "$STAGING"
          ls -lh dist/macos/
          hdiutil imageinfo "$DMG_PATH" | head -20

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/macos/tally-*
          if-no-files-found: error

  release:
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.zip' -o -name '*.dmg' -o -name '*.msix' -o -name '*.cer' \) -exec cp -v {} release-assets/ \;
          echo "=== Release assets ==="
          ls -lh release-assets/
          COUNT=$(find release-assets -type f | wc -l)
          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: expected at least 3 assets, got $COUNT"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_version.outputs.version }}
          name: Release ${{ steps.set_version.outputs.version }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## What's Changed
            - Backend modularized (config/models/state/auth/db/handlers)
            - Flutter ApiService split into services/api/*
            - Dependencies: axum 0.8, sqlx 0.9, tower-http 0.7
            - Windows: immersive title bar + Impeller disabled for text fringe
            - Rounded platform icons
            - Package id: `com.luminous.tally`
            - Windows MSIX + self-signed certificate

            ## Builds
            | Platform | Asset |
            |----------|-------|
            | Android | `tally-*-android.apk` / `.aab` |
            | Windows | `tally-*-windows.msix` + `.cer` / `.zip` |
            | macOS | `tally-*-macos.dmg` |

            ## Windows MSIX (self-signed)
            1. Download MSIX + `tally-windows-selfsigned.cer`
            2. Install the cer into Local Machine Trusted People / Trusted Root
            3. Install the MSIX, or just use the ZIP

            ## Backend
            - Health: `GET /api/v1/health`
            - Optional password: `API_PASSWORD` or config.toml `[server].password`
            - Package id: `com.luminous.tally`
