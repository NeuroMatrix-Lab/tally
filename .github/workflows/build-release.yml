name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.1.2)'
        required: true
        default: 'v1.1.4'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          BUILD_NAME=$(echo $VERSION | sed 's/^v//')
          BUILD_NUMBER=$(echo $BUILD_NAME | awk -F. '{printf("%d%02d%02d", $1, $2, $3)}')
          echo "Building with build-name: $BUILD_NAME, build-number: $BUILD_NUMBER"
          flutter build apk --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
          flutter build appbundle --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Package Android artifacts
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          mkdir -p dist/android

          APK_PATH=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*release*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            find build/app/outputs/flutter-apk -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$APK_PATH" "dist/android/tally-${VERSION}-android.apk"

          AAB_PATH=$(find build/app/outputs/bundle/release -maxdepth 1 -name '*release*.aab' | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: AAB not found"
            find build/app/outputs/bundle/release -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$AAB_PATH" "dist/android/tally-${VERSION}-android.aab"

          ls -lh dist/android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: dist/android/tally-*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $VERSION = "${{ github.event.inputs.tag_name }}"
          } else {
            $VERSION = "${{ github.ref_name }}"
          }
          "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Prepare code-signing certificate
        id: cert
        shell: pwsh
        run: |
          $outDir = "build/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $publisher = "CN=Luminous, O=Luminous, C=CN"
          # 优先使用仓库 Secrets 里的正式/固定证书；否则生成自签证书并与 MSIX 一起发布
          $b64 = "${{ secrets.WINDOWS_PFX_BASE64 }}"
          $pwd = "${{ secrets.WINDOWS_PFX_PASSWORD }}"
          $secretPublisher = "${{ secrets.WINDOWS_PFX_PUBLISHER }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "tally-windows.pfx"
          $cerPath = Join-Path $outDir "tally-windows-selfsigned.cer"

          if (-not [string]::IsNullOrWhiteSpace($secretPublisher)) {
            $publisher = $secretPublisher
          }

          if (-not [string]::IsNullOrWhiteSpace($b64) -and -not [string]::IsNullOrWhiteSpace($pwd)) {
            Write-Host "Using certificate from repository secrets."
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($b64))
            $certPwd = ConvertTo-SecureString -String $pwd -Force -AsPlainText
            # 尽量导出公钥，方便和 Release 一起分发
            try {
              $tmpCer = Join-Path $env:RUNNER_TEMP "tally-from-pfx.cer"
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $certPwd)
              [IO.File]::WriteAllBytes($tmpCer, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Copy-Item $tmpCer $cerPath -Force
            } catch {
              Write-Host "WARN: could not export cer from secrets PFX: $_"
            }
            "cert_source=secrets" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Generating self-signed code-signing certificate for MSIX..."
            $certPwdPlain = "TallyMsixSelfSigned-1.1.4"
            $certPwd = ConvertTo-SecureString -String $certPwdPlain -Force -AsPlainText
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject $publisher `
              -FriendlyName "Tally MSIX Self-Signed" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature `
              -NotAfter (Get-Date).AddYears(5) `
              -CertStoreLocation "Cert:\CurrentUser\My"
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $certPwd | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            $pwd = $certPwdPlain
            "cert_source=selfsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          # publisher 必须与证书 Subject 一致
          $certObj = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, (ConvertTo-SecureString -String $pwd -Force -AsPlainText))
          $subject = $certObj.Subject
          Write-Host "Certificate subject: $subject"
          (Get-Content pubspec.yaml) -replace '(?m)^\s*publisher:.*$', "  publisher: `"$subject`"" | Set-Content pubspec.yaml -Encoding utf8

          "has_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pfx_password=$pwd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cer_path=$cerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publisher=$subject" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSIX
        if: steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.set_version.outputs.version }}".TrimStart('v')
          $outName = "tally-$(${{ steps.set_version.outputs.version }})-windows"
          # 例如 tally-v1.1.4-windows.msix → 保持 tag 风格
          $tag = "${{ steps.set_version.outputs.version }}"
          $outName = "tally-$tag-windows"
          dart run msix:create `
            --build-windows false `
            --output-path build/windows `
            --output-name $outName `
            --certificate-path "${{ steps.cert.outputs.pfx_path }}" `
            --certificate-password "${{ steps.cert.outputs.pfx_password }}" `
            --publisher "${{ steps.cert.outputs.publisher }}" `
            --install-certificate false `
            --release
          Get-ChildItem -Path build/windows -Filter "*.msix" | Format-List FullName, Length
          Get-ChildItem -Path build/windows -Filter "*.cer" | Format-List FullName, Length

      - name: Create Windows Zip
        run: |
          $version = "${{ steps.set_version.outputs.version }}"
          $zipName = "tally-${version}-windows.zip"
          Write-Host "Creating zip: $zipName"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\$zipName
          Get-ChildItem -Path build\windows -Filter "tally-*.zip" | Format-List Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            build/windows/tally-*.zip
            build/windows/*.msix
            build/windows/*.cer
            build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          BUILD_NAME=$(echo $VERSION | sed 's/^v//')
          BUILD_NUMBER=$(echo $BUILD_NAME | awk -F. '{printf("%d%02d%02d", $1, $2, $3)}')
          echo "Building macOS with build-name: $BUILD_NAME, build-number: $BUILD_NUMBER"
          flutter build macos --release --no-tree-shake-icons --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Package macOS DMG
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find build/macos/Build/Products/Release -maxdepth 2 -print
            exit 1
          fi
          mkdir -p dist/macos
          DMG_PATH="dist/macos/tally-${VERSION}-macos.dmg"
          STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Tally" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          rm -rf "$STAGING"
          ls -lh dist/macos/
          hdiutil imageinfo "$DMG_PATH" | head -20

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/macos/tally-*
          if-no-files-found: error

  build-server-rpm:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version for RPM: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build server
        working-directory: server
        run: cargo build --release --locked

      - name: Package server RPM
        working-directory: server
        env:
          RPM_VERSION: ${{ steps.set_version.outputs.version }}
        run: |
          RPM_ROOT="$PWD/rpmbuild"
          mkdir -p "$RPM_ROOT"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$RPM_ROOT/buildroot/usr/bin"
          mkdir -p "$RPM_ROOT/buildroot/etc/tally"
          mkdir -p "$RPM_ROOT/buildroot/usr/lib/systemd/system"

          install -m 0755 target/release/tally-server "$RPM_ROOT/buildroot/usr/bin/tally-server"
          install -m 0644 config.toml "$RPM_ROOT/buildroot/etc/tally/config.toml"
          cat > "$RPM_ROOT/buildroot/usr/lib/systemd/system/tally-server.service" <<'EOF'
          [Unit]
          Description=Tally bookkeeping backend
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/tally-server
          Environment=CONFIG_PATH=/etc/tally/config.toml
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > "$RPM_ROOT/SPECS/tally-server.spec" <<EOF
          Name:           tally-server
          Version:        ${RPM_VERSION}
          Release:        1%{?dist}
          Summary:        Tally bookkeeping backend
          License:        MIT
          AutoReqProv:    no
          Requires:       openssl-libs
          Requires:       ca-certificates
          Requires:       systemd

          %description
          Rust backend service for the Tally bookkeeping application.

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/etc/tally
          mkdir -p %{buildroot}/usr/lib/systemd/system
          cp -a %{_topdir}/buildroot/usr/bin/tally-server %{buildroot}/usr/bin/
          cp -a %{_topdir}/buildroot/etc/tally/config.toml %{buildroot}/etc/tally/
          cp -a %{_topdir}/buildroot/usr/lib/systemd/system/tally-server.service %{buildroot}/usr/lib/systemd/system/

          %post
          systemctl daemon-reload >/dev/null 2>&1 || :

          %preun
          if [ "\$1" -eq 0 ]; then
            systemctl disable --now tally-server.service >/dev/null 2>&1 || :
          fi

          %postun
          systemctl daemon-reload >/dev/null 2>&1 || :

          %files
          %attr(0755,root,root) /usr/bin/tally-server
          %config(noreplace) %attr(0644,root,root) /etc/tally/config.toml
          %attr(0644,root,root) /usr/lib/systemd/system/tally-server.service
          EOF

          rpmbuild --define "_topdir $RPM_ROOT" -bb "$RPM_ROOT/SPECS/tally-server.spec"

          echo "=== rpmbuild outputs ==="
          find "$RPM_ROOT/RPMS" -type f -ls || true

          OUT_DIR="${{ github.workspace }}/dist/server"
          mkdir -p "$OUT_DIR"
          RPM_SRC=$(find "$RPM_ROOT/RPMS" -type f -name 'tally-server-*.rpm' | head -n 1)
          if [ -z "$RPM_SRC" ]; then
            echo "ERROR: no RPM produced by rpmbuild"
            find "$RPM_ROOT" -type f -ls || true
            exit 1
          fi
          cp "$RPM_SRC" "$OUT_DIR/tally-server-${RPM_VERSION}-linux.rpm"
          ls -lh "$OUT_DIR"

      - name: Upload server RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-rpm
          path: dist/server/tally-server-*.rpm
          if-no-files-found: error

  release:
    needs: [build-android, build-windows, build-macos, build-server-rpm]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.zip' -o -name '*.dmg' -o -name '*.rpm' -o -name '*.msix' -o -name '*.cer' \) -exec cp -v {} release-assets/ \;
          echo "=== Release assets ==="
          ls -lh release-assets/
          COUNT=$(find release-assets -type f | wc -l)
          if [ "$COUNT" -lt 5 ]; then
            echo "ERROR: expected at least 5 assets, got $COUNT"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_version.outputs.version }}
          name: Release ${{ steps.set_version.outputs.version }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## What's Changed
            - Backend modularized: `server/src` split into config/models/state/auth/db/handlers
            - Flutter `ApiService` split into `services/api/*` (records/ledgers/staff/meta)
            - Dependencies: axum 0.8, sqlx 0.9, tower-http 0.7
            - Windows: immersive title bar (Tally palette + rounded corners)
            - Windows: disable Impeller + system fonts to reduce text edge flicker
            - Server CI now runs cargo test
            - Package id fixed: `com.luminous.tally`
            - Windows: MSIX installer + self-signed certificate in this release

            ## Builds
            | Platform | Asset |
            |----------|-------|
            | Android | `tally-*-android.apk` / `.aab` |
            | Windows | `tally-*-windows.msix` + `tally-windows-selfsigned.cer` / `.zip` |
            | macOS | `tally-*-macos.dmg` |
            | Linux backend | `tally-server-*-linux.rpm` |

            ## Install Windows MSIX (self-signed)
            1. Download `tally-*-windows.msix` and `tally-windows-selfsigned.cer`
            2. Double-click the `.cer` → Install Certificate → Local Machine → Trusted Root / Trusted People
            3. Install the `.msix` (若提示证书不受信任，说明第 2 步未完成)
            4. 或直接解压 `tally-*-windows.zip` 使用

            ## Backend notes
            - Health: `GET /api/v1/health` (no auth)
            - Auth check: `GET /api/v1/auth`
            - Optional password: set `API_PASSWORD` or `[server].password` in config.toml
            - Package / bundle id: `com.luminous.tally`
            - MSIX identity: `com.luminous.tally`
            - Default self-signed publisher: `CN=Luminous, O=Luminous, C=CN`（Subject 以当次 Release 中证书为准）
            - Optional repo secrets for a stable cert: `WINDOWS_PFX_BASE64`, `WINDOWS_PFX_PASSWORD`, `WINDOWS_PFX_PUBLISHER`

