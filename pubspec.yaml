name: tally
description: "一款记账软件"
publish_to: 'none'

version: 1.1.6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  excel: ^4.0.6
  path_provider: ^2.1.3
  share_plus: ^13.3.0
  http: ^1.6.0
  image_picker: ^1.2.1
  flutter_image_compress: ^2.3.0
  mysql1: ^0.20.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  msix: ^3.16.13

# GitHub 不可达时：macOS 用系统 SQLite；Android 走 ghproxy 镜像下载预编译库
hooks:
  user_defines:
    sqlite3:
      source:
        macos: system
        default: sqlite3
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

flutter:
  uses-material-design: true

msix_config:
  display_name: "Tally"
  publisher_display_name: "殷灵涵Luminous"
  # 必须与代码签名证书 Subject 完全一致（自签默认见 CI / 发布说明）
  publisher: "CN=Luminous, O=Luminous, C=CN"
  identity_name: "com.luminous.tally"
  msix_version: "1.1.6.0"
  logo_path: "android/app/src/main/res/mipmap-hdpi/ic_launcher.png"
  capabilities: internetClient, location
  # 自签/外部证书由 CI 通过 msix:create --certificate-path 注入，勿提交私钥
